# Optional 3-node JetStream cluster overlay (local HA / container-service with Replicas=3).
# Usage:
#   docker compose -f docker-compose.nats.yaml -f docker-compose.nats.cluster.yaml --profile nats-cluster up -d
#
# Note: do not reuse single-node nats_data volumes here — remove volumes first when switching topologies.
services:
  nats:
    container_name: chatapprealtimeservices-nats-1
    command:
      - "--jetstream"
      - "--name=nats-1"
      - "--cluster_name=chatapp"
      - "--cluster=nats://0.0.0.0:6222"
      - "--routes=nats://nats2:6222,nats://nats3:6222"
      - "--http_port=8222"
      - "--store_dir=/data"
    volumes:
      - nats_data_1:/data
    healthcheck:
      disable: true

  nats2:
    profiles: ["nats-cluster"]
    image: nats:2.10.26-alpine
    restart: unless-stopped
    command:
      - "--jetstream"
      - "--name=nats-2"
      - "--cluster_name=chatapp"
      - "--cluster=nats://0.0.0.0:6222"
      - "--routes=nats://nats:6222,nats://nats3:6222"
      - "--http_port=8222"
      - "--store_dir=/data"
    volumes:
      - nats_data_2:/data

  nats3:
    profiles: ["nats-cluster"]
    image: nats:2.10.26-alpine
    restart: unless-stopped
    command:
      - "--jetstream"
      - "--name=nats-3"
      - "--cluster_name=chatapp"
      - "--cluster=nats://0.0.0.0:6222"
      - "--routes=nats://nats:6222,nats://nats2:6222"
      - "--http_port=8222"
      - "--store_dir=/data"
    volumes:
      - nats_data_3:/data

  realtime_services:
    depends_on:
      nats:
        condition: service_started
      nats2:
        condition: service_started
      nats3:
        condition: service_started
      realtime_migrations:
        condition: service_completed_successfully
      garnet_cache:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Container
      Nats__Url: nats://nats:4222,nats://nats2:4222,nats://nats3:4222
      Nats__JetStream__Replicas: 3

volumes:
  nats_data_1:
  nats_data_2:
  nats_data_3:
