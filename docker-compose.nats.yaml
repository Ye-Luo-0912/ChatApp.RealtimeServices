# Local / Performance default: single-node JetStream (Replicas=1).
# For 3-node HA, use: docker compose -f docker-compose.nats.yaml -f docker-compose.nats.cluster.yaml --profile nats-cluster up -d
services:
  nats:
    image: nats:2.10.26-alpine
    container_name: chatapp_nats
    restart: unless-stopped
    command:
      - "--jetstream"
      - "--name=nats-1"
      - "--http_port=8222"
      - "--store_dir=/data"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  realtime_migrations:
    profiles: ["container-service"]
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres_db:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./scripts/realtime-schema.sql:/migrations/realtime-schema.sql:ro
    command:
      - psql
      - --host=postgres_db
      - --username=postgres
      - --dbname=ChatAppDatabase
      - --set=ON_ERROR_STOP=1
      - --file=/migrations/realtime-schema.sql

  realtime_services:
    profiles: ["container-service"]
    build:
      context: .
      dockerfile: ChatApp.RealtimeServices/Dockerfile
      args:
        FINAL_BASE_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      nats:
        condition: service_healthy
      realtime_migrations:
        condition: service_completed_successfully
      garnet_cache:
        condition: service_started
    environment:
      # Development allows JetStream Replicas=1 against single-node NATS.
      # Use docker-compose.nats.cluster.yaml for Container + Replicas=3.
      DOTNET_ENVIRONMENT: Development
      Realtime__ServiceName: ChatApp.RealtimeServices
      Realtime__InstanceId: auto
      Nats__Url: nats://nats:4222
      Nats__Mode: JetStream
      Nats__QueueGroup: chatapp-realtime-services
      Nats__Subjects__MessageReceipts: chat.message-receipts
      Nats__JetStream__Streams__MessageReceipts: MESSAGE_RECEIPTS
      Nats__JetStream__Replicas: 1
      ConnectionStrings__Garnet: garnet_cache:6379,abortConnect=false
      ConnectionStrings__RealtimeDatabase: Host=postgres_db;Port=5432;Database=ChatAppDatabase;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=100;Connection Idle Lifetime=300;Timeout=5;Command Timeout=5;
      RealtimeDatabase__Schema: realtime
      RealtimeDatabase__MessageStoreProvider: Npgsql
      RealtimeDatabase__InitializeSchemaOnStart: "false"
    expose:
      - "8080"
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

volumes:
  nats_data:
