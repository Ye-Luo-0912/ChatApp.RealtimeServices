name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ChatApp.RealtimeServices.slnx

      - name: Build
        run: dotnet build ChatApp.RealtimeServices.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ChatApp.RealtimeServices.slnx --no-build --configuration Release

      - name: Build container
        run: docker build --file ChatApp.RealtimeServices/Dockerfile --tag chatapp-realtime-services:ci .

  benchmark:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ChatApp.RealtimeServices.slnx

      - name: Build benchmarks
        run: dotnet build ChatApp.Realtime.Benchmarks/ChatApp.Realtime.Benchmarks.csproj -c Release --no-restore

      - name: Run benchmarks
        run: |
          dotnet run --project ChatApp.Realtime.Benchmarks/ChatApp.Realtime.Benchmarks.csproj -c Release -- \
            --filter '*' \
            --exporters json \
            --artifacts ./benchmark-results

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: ./benchmark-results/
