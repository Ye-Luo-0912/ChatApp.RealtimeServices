name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package version bump gate
        shell: pwsh
        env:
          PACKAGE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./tools/verify-package-version-bump.ps1 -BaseRef $env:PACKAGE_BASE_REF

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore
        run: dotnet restore ChatApp.RealtimeServices.slnx --locked-mode

      - name: Build
        run: dotnet build ChatApp.RealtimeServices.slnx --no-restore --configuration Release

      - name: Package content reproducibility smoke
        shell: pwsh
        run: |
          ./tools/publish-contracts.ps1 -FeedPath .artifacts/package-integrity
          ./tools/publish-contracts.ps1 -FeedPath .artifacts/package-integrity

      - name: Test
        run: dotnet test ChatApp.RealtimeServices.slnx --no-build --no-restore --configuration Release

      - name: Build container
        run: docker build --file ChatApp.RealtimeServices/Dockerfile --tag chatapp-realtime-services:ci .

  benchmark:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore
        run: dotnet restore ChatApp.RealtimeServices.slnx --locked-mode

      - name: Build benchmarks
        run: dotnet build ChatApp.Realtime.Benchmarks/ChatApp.Realtime.Benchmarks.csproj -c Release --no-restore

      - name: Run benchmarks
        run: |
          dotnet run --project ChatApp.Realtime.Benchmarks/ChatApp.Realtime.Benchmarks.csproj -c Release -- \
            --filter '*' \
            --exporters json \
            --artifacts ./benchmark-results

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-baseline
          path: ./benchmark-results/

  # 六-3：PR 级别 benchmark smoke 测试，快速检测性能回退。
  # 只运行 Outbox 关键路径基准（最快），与 main 分支 baseline 对比。
  # SQL 命令数门禁：默认 0% 回退（单调不减），任何 SQL 往返次数增加都会 FAIL。
  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore
        run: dotnet restore ChatApp.RealtimeServices.slnx --locked-mode

      - name: Build benchmarks
        run: dotnet build ChatApp.Realtime.Benchmarks/ChatApp.Realtime.Benchmarks.csproj -c Release --no-restore

      - name: Download baseline (from latest main)
        id: download-baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch main \
            --workflow build \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' || echo "")
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No baseline run found, skipping comparison."
            exit 0
          fi
          echo "Downloading baseline from run $RUN_ID"
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name benchmark-baseline \
            --dir ./baseline || exit 0

      - name: Run benchmark smoke (Outbox only, fast)
        run: |
          dotnet run --project ChatApp.Realtime.Benchmarks/ChatApp.Realtime.Benchmarks.csproj -c Release -- \
            --filter '*Outbox*' \
            --exporters json \
            --artifacts ./benchmark-smoke

      - name: Compare with baseline
        if: steps.download-baseline.outcome == 'success'
        shell: pwsh
        run: |
          $baselineFiles = Get-ChildItem ./baseline -Filter "*-report.json" -Recurse -ErrorAction SilentlyContinue
          $currentFiles = Get-ChildItem ./benchmark-smoke -Filter "*-report.json" -Recurse -ErrorAction SilentlyContinue
          if (-not $baselineFiles) {
            Write-Host "No baseline JSON found, skipping comparison."
            exit 0
          }
          if (-not $currentFiles) {
            Write-Host "No current JSON found, skipping comparison."
            exit 0
          }
          # 六-1：SQL 命令数门禁阈值 0%（单调不减）。
          pwsh scripts/compare-benchmarks.ps1 \
            -Baseline $baselineFiles[0].FullName \
            -Current $currentFiles[0].FullName \
            -SqlCommandCountRegressionPct 0

      - name: Upload benchmark smoke results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-results
          path: ./benchmark-smoke/
