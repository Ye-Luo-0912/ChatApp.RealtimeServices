name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ChatApp.RealtimeServices.slnx

      - name: Build
        run: dotnet build ChatApp.RealtimeServices.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ChatApp.RealtimeServices.slnx --no-build --configuration Release

      - name: Build container
        run: docker build --file ChatApp.RealtimeServices/Dockerfile --tag chatapp-realtime-services:ci .
