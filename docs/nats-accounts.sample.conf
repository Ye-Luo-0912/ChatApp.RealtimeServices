# NATS accounts sample (ops reference)
#
# Gateway account: publish/request on ingress subjects only.
# Realtime account: subscribe ingress + publish realtime-events / replies.
# Never rely on X-Chat-* headers alone for production isolation.

accounts: {
  GATEWAY: {
    users: [
      { user: gateway, password: "change-me-gateway" }
    ]
    exports: []
    permissions: {
      publish: {
        allow: [
          "chat.incoming-messages",
          "chat.message-receipts",
          "chat.message-history.query",
          "chat.conversation-list.query",
          "chat.conversation-mark-read",
          "chat.conversation-prefs.set",
          "chat.sync.bootstrap",
          "chat.realtime-events"
        ]
      }
      subscribe: {
        allow: [
          "chat.realtime-events",
          "_INBOX.>"
        ]
      }
    }
  }

  REALTIME: {
    users: [
      { user: realtime, password: "change-me-realtime" }
    ]
    permissions: {
      publish: {
        allow: [
          "chat.realtime-events",
          "chat.realtime-events.account-deleted",
          "chat.dead-letters",
          "_INBOX.>"
        ]
      }
      subscribe: {
        allow: [
          "chat.incoming-messages",
          "chat.message-receipts",
          "chat.message-history.query",
          "chat.conversation-list.query",
          "chat.conversation-mark-read",
          "chat.conversation-prefs.set",
          "chat.sync.bootstrap",
          "chat.realtime-events",
          "chat.realtime-events.account-deleted",
          "chat.dead-letters"
        ]
      }
    }
  }
}

authorization: {
  default_permissions: {
    publish: { deny: [">"] }
    subscribe: { deny: [">"] }
  }
}
